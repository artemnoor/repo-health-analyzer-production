version: 1

# Repo Health owns this policy. The existing SourceCraft/CollectOSS collector
# owns API calls, pagination, permissions, and raw event collection.
analyzer:
  id: chaoss.issues_prs
  version: issues-sourcecraft-policy-v1
  category: chaoss-issues-prs
  dimensions: [issues, pull_requests, review, delivery]
  requires: [chaoss:events]
  phase: 60
  cost: 40
  timeout: 60
  cache_policy: read_write
  source_commit: 339edc520e79dd1728ca19255d94a05a4a107df1
  enabled_by_mode: [fast, full, offline, diff, backfill]

methodology:
  open_digger_revision: 63e4b89ecd525221be95fe2a48a714ebb3c722ec
  chaoss_metrics_revision: fae1f4dfc533a6f28499bdba3fb1514ccabc2018
  unanswered_policy: explicit_unanswered_no_duration_fallback

policy:
  policy_revision: issues-sourcecraft-policy-v1
  source:
    source_commit: 339edc520e79dd1728ca19255d94a05a4a107df1
  windows:
    analysis_window_days: 90
    trend_bucket_days: 30
    maturity_window_days: 30
    stale_threshold_days: 30
    old_backlog_threshold_days: 90
    age_buckets_days: [15, 30, 60, 90]
    stale_activity_event_types: [commented, reopened]
  exclude_issue_author_from_response: true
  unknown_actor_policy: exclude_from_human_response_and_reduce_coverage
  bot_filtering:
    known_identities: ['dependabot[bot]', 'renovate[bot]']
    patterns:
      - '^dependabot(?:\[bot\])?$'
      - '^renovate(?:\[bot\])?$'
      - '^github-actions(?:\[bot\])?$'
  thresholds:
    minimum_sample: 5
    minimum_coverage: 0.80
    # Components with valid counts/ages may contribute when optional API
    # fields (comments or lifecycle events) are absent. The full threshold
    # remains the requirement for responsiveness; this lower bound is only
    # for independently measurable partial components.
    partial_component_min_coverage: 0.50
    maximum_findings: 25
    response_median_target_hours: 72
    response_median_breach_hours: 360
    response_p75_target_hours: 168
    response_p75_breach_hours: 720
    close_median_target_hours: 360
    close_median_breach_hours: 1440
    close_p75_target_hours: 720
    close_p75_breach_hours: 2160
    backlog_age_target_hours: 720
    backlog_age_breach_hours: 2160
  score:
    responsiveness_weight: 0.30
    resolution_weight: 0.30
    backlog_weight: 0.25
    maintenance_weight: 0.15
    issues_max_share: 0.25
  logging:
    raw_payload: hash_only
    comment_body: forbidden
    actor_login: forbidden
