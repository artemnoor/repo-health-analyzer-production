version: 1

# RepoCrunch owns the async GitHub client, ETag cache, retries and extractors.
# This file describes the source policy consumed by the thin Forge adapter.
forge:
  provider: github
  source: repocrunch
  source_commit: 12938318a6bd59e30a431ab2582baff5d8673eca
  limits:
    max_files: 50000
    max_commits: 10000
    max_pages: 100
    max_concurrent_requests: 2
    retry_budget: 2
    max_report_bytes: 33554432
  endpoints:
    - repository
    - languages
    - tree
    - commits
    - contributors
    - branch_protection
  windows:
    default: all
    diff: changed_since_head
  pagination:
    preserve_link_header: true
    max_pages: 100
  cache:
    etag: true
    ttl_seconds: 86400
    stale_after_seconds: 172800
    allow_stale: true
  permissions:
    401: unknown
    403: unknown
    404: unknown
  cursor_field: cursor
  raw_event_key: stable_event_id
