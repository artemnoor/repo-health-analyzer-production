version: 1

score:
  policy_version: repo-health-score-v1
  weights:
    Documentation: 0.15
    Activity: 0.15
    Issues: 0.15
    CI/CD: 0.15
    Security: 0.20
    Code Health: 0.20
  coverage:
    formula: K=sum(w_j*q_j)/sum(w_j), q_j=coverage_j*confidence_j
    score_minimum_categories: 5
    provisional_minimum_categories: 4
    score_minimum_k: 0.75
    provisional_minimum_k: 0.50
  security_caps:
    confirmed_high: 60
    confirmed_critical: 40
    confirmed_secret: 40
