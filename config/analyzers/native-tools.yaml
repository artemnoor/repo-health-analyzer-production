version: 1

# Native projects remain the owners of their algorithms. These entries only
# describe the argv boundary and the pinned source used to build each tool.
policy:
  max_concurrent_processes: 2
  retry_budget: 1
  max_files: 50000
  max_commits: 10000
  max_report_bytes: 67108864
  cache:
    ttl_seconds: 86400
    stale_after_seconds: 172800
    allow_stale: true
  history:
    fast: recent
    full: all
    diff: changed_since_head
    backfill: all
  failure_policy:
    fail: fail
    pass: pass
    skipped: visible_skip
    inconclusive: visible_inconclusive
    error: visible_error
  ci_gate:
    fail_on: [fail]
    visible_statuses: [skipped, inconclusive, error]
    unavailable_score: null
tools:
  scorecard.local:
    executable: bin/scorecard
    executable_windows: bin/scorecard.exe
    command: ["--local", "{repo_path}", "--format", "json", "--show-details"]
    input: repository_path
    output: json
    timeout: 120
    max_output_bytes: 16777216
    source_commit: f92023a3f77879f96e0c9c1305f289d755be4bb6
    enabled_by_mode: [full, diff, backfill]
    status_mapping:
      inconclusive_score: -1

  repohealth.baseline:
    executable: bin/repohealth
    executable_windows: bin/repohealth.exe
    command: ["{repo_path}", "--format", "json"]
    input: repository_path
    output: json
    timeout: 120
    max_output_bytes: 16777216
    source_commit: a62f96a00134e7f08541fa00dd962666222394f8
    enabled_by_mode: [fast, full, offline, diff, backfill]
    status_mapping:
      valid_threshold_exit: warn

  criticality.importance:
    executable: bin/criticality-score
    executable_windows: bin/criticality-score.exe
    command: ["-config", "vendor/criticality_score/internal/scorer/default_config.yml", "-"]
    input: csv_stdin
    output: csv
    timeout: 120
    max_output_bytes: 16777216
    source_commit: 0e76c6a99d865dddcbd89dff4117f0a54b1abfb8
    enabled_by_mode: [full, diff, backfill]
    status_mapping:
      missing_signal: inconclusive
      score_field: priority_context

  qlty.check:
    executable: bin/qlty
    executable_windows: bin/qlty.exe
    # Qlty owns plugin planning, batching and its cache. Full mode adds --all
    # at the adapter boundary; diff/fast keep Qlty's native target selection.
    command: ["check", "--sarif", "--no-progress", "--no-fix", "{repo_path}"]
    input: repository_path
    output: sarif
    timeout: 120
    max_output_bytes: 16777216
    source_commit: 338acb3405a966151cd9e29685f2a8eb71d92434
    enabled_by_mode: [fast, full, diff, backfill]
    status_mapping:
      error_level: fail
      warning_level: warn

  sokrates.analysis:
    executable: java
    command: ["-jar", "{sokrates_jar}", "generateReports", "-confFile", "{sokrates_config}", "-outputFolder", "{sokrates_output}"]
    input: repository_path
    output: data/analysisResults.json
    timeout: 180
    max_output_bytes: 16777216
    source_commit: f400eb7235a755146e854a1bf4bd90cbe1ee5086
    enabled_by_mode: [full, backfill]
    status_mapping:
      unsupported_export: inconclusive
