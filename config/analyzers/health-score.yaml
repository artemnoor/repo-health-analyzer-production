version: health-score-v1

# Canonical dimensions. A missing dimension is unavailable and is excluded
# from the weighted mean; it is never converted into a zero.
weights:
  code: 0.25
  history: 0.15
  tests: 0.15
  dependencies: 0.10
  security: 0.15
  delivery: 0.10
  community: 0.05
  docs: 0.05

# Coverage is exposed separately from score. This threshold is informational
# for consumers that decide whether a snapshot is rankable.
min_evidence_coverage: 0.0
