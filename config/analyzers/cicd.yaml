version: 1

# SourceCraft is the runtime data source. Apache DevLake is methodology-only.
analyzer:
  id: cicd.sourcecraft
  source_id: sourcecraft.cicd
  version: cicd-sourcecraft-policy-v1
  schema_version: sourcecraft-cicd-inventory-v1
  category: cicd
  dimensions: [delivery]
  source_commit: sourcecraft-cicd-api
  # Enable read_write only after the health edge supplies source_snapshot_digest
  # before the analyzer cache lookup.
  cache_policy: none
  enabled_by_mode: [fast, full, offline, diff, backfill]

policy:
  policy_revision: cicd-sourcecraft-policy-v1
  windows:
    analysis_window_days: 90
    current_period_days: 30
    previous_period_days: 30
    oldest_period_days: 30
  thresholds:
    minimum_terminal_runs: 5
    minimum_decisive_runs: 5
    preferred_terminal_runs: 10
    minimum_duration_runs: 5
    minimum_trend_runs_per_period: 3
    minimum_duration_trend_runs_per_period: 5
    maximum_findings: 25
    failure_warning_rate: 0.20
    failure_critical_rate: 0.50
    warning_streak: 2
    critical_streak: 5
    failure_trend_scale: 0.20
    duration_trend_scale: 0.50
    p50_target_seconds: 300
    p50_breach_seconds: 1800
    p95_target_seconds: 900
    p95_breach_seconds: 3600
  score:
    reliability_weight: 0.75
    failure_streak_weight: 0.15
    duration_weight: 0.05
    trend_weight: 0.05
  pagination:
    page_size: 100
    max_pages: 1000
  dora:
    deployment_events: required
    production_environment: required
    deployment_commits: required
    incidents: required
    restore_events: required
  logging:
    raw_payload: forbidden
    logs: forbidden
    secrets: forbidden
