on:
  push:
    - workflows: [calibration-ci]
      filter:
        branches: ["main"]

workflows:
  calibration-ci:
    tasks:
      - name: calibration
        cubes:
          - name: result
            image:
              name: alpine:3.20
              entrypoint: ""
            script:
              - |
                if [ -f "$SOURCECRAFT_WORKSPACE/CALIBRATION_FAIL" ]; then
                  echo "controlled calibration failure"
                  exit 1
                fi
                echo "controlled calibration success"
